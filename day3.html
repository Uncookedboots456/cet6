<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>六级词汇 · 第3天</title>
<style>
:root{--bg:#15191c;--card:#1f2629;--ink:#e3ebe8;--mute:#8a9a95;--dim:#4c5a5e;--acc:#4fa58c;--bad:#e0705f;--good:#5cb57d;--btn:#2a3437;--soft:#263533;--line:#36433f;--ex:#b9c7c3;--mk:#4fa58c44}
:root[data-theme=light]{--bg:#f4f6f3;--card:#fff;--ink:#2d3a36;--mute:#6f7f7a;--dim:#b6c2be;--acc:#3f8f7a;--bad:#d9665a;--good:#4f9e6c;--btn:#e3ebe7;--soft:#eaf3ef;--line:#d5dfda;--ex:#4a5a55;--mk:#3f8f7a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:14px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:4px 0}.sub{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}.tabs button{flex:1;min-width:64px}
button{font:inherit;border:0;border-radius:12px;padding:12px;min-height:46px;background:var(--btn);color:var(--ink);cursor:pointer;font-size:15px}
button.on,.pri{background:var(--acc);color:#fff}button:active{transform:scale(.97)}
.sm{min-height:34px;padding:6px 10px;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px}.row>button{flex:1}
.snd{background:var(--soft);min-height:40px;padding:8px 12px;font-size:14px;margin:4px}
.bad{background:var(--bad);color:#fff}.good{background:var(--good);color:#fff}
.hint{color:var(--mute);font-size:13px;margin-top:10px}
.keys{color:var(--mute);font-size:12px;text-align:center;margin-top:14px;line-height:1.8}
kbd{background:var(--btn);border-radius:5px;padding:1px 6px;font-family:inherit;border-bottom:2px solid var(--line)}
.done{text-align:center;padding:24px 10px}.big{font-size:44px}
.fb{min-height:24px;text-align:center;margin:8px 0}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.06)}}
/* 打字 */
.tstat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--card);border-radius:14px;padding:10px;text-align:center;margin-bottom:10px}
.tstat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.tstat span{font-size:12px;color:var(--mute)}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.tools button.on{background:var(--soft);color:var(--acc);outline:1px solid var(--acc)}
.stage{text-align:center;padding:34px 8px 20px;min-height:290px;cursor:text}
.tw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(34px,9vw,60px);letter-spacing:.06em;font-weight:500;user-select:none}
.tw span{color:var(--dim);transition:color .08s}.tw span.ok{color:var(--good)}.tw span.err{color:var(--bad)}
.tw.dict span:not(.ok):not(.err){color:transparent;border-bottom:3px solid var(--dim);margin:0 2px}
.shake{animation:shake .32s}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.tph{color:var(--mute);margin:10px 0 4px;font-size:16px}.tmean{font-size:19px;margin:6px 0 14px}
.tex{color:var(--ex);font-size:15px;line-height:1.6;max-width:560px;margin:auto}
.tnext{color:var(--dim);font-size:13px;margin-top:22px}
.paused{color:var(--mute);font-size:14px;margin-top:8px}
.wl{text-align:left;max-width:420px;margin:12px auto;background:var(--card);border-radius:14px;padding:6px 14px}
.wl div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.wl div:last-child{border:0}
#ti{position:fixed;opacity:0;left:-100px;top:0;width:10px;height:10px}
/* 闪卡 */
.flip{perspective:1000px;height:300px;margin-bottom:14px}
.inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.f .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:20px;box-shadow:0 4px 18px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.back{transform:rotateY(180deg)}
.word{font-size:34px;font-weight:600}.ph{color:var(--mute);margin:6px 0 12px}.mean{font-size:20px;margin-bottom:10px}.ex{font-size:15px;line-height:1.5;color:var(--ex)}
.mark{outline:3px solid var(--acc)}
.q{background:var(--card);border-radius:20px;padding:22px;text-align:center;margin-bottom:14px;box-shadow:0 4px 18px #0003}
.opts{display:grid;gap:10px}.opts button{text-align:left;background:var(--card)}
.opts .ok{background:var(--good);color:#fff}.opts .no{background:var(--bad);color:#fff}
/* 音节 */
.sy{display:flex;justify-content:center;flex-wrap:wrap;font-size:40px;font-weight:600;margin:18px 0;user-select:none;font-family:ui-monospace,Menlo,Consolas,monospace}
.gap{width:18px;min-height:58px;padding:0;border-radius:6px;background:transparent;position:relative}
.gap:hover{background:var(--soft)}.gap.cur{outline:2px dashed var(--mute)}
.gap.on::after{content:"·";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:42px}
.myw{font-size:18px;color:var(--acc);min-height:26px}
/* 阅读 */
.rd{display:grid;gap:16px}@media(min-width:720px){.rd{grid-template-columns:1.15fr 1fr;align-items:start}.rp{position:sticky;top:10px;max-height:92vh;overflow:auto}}
.rp,.rq{background:var(--card);border-radius:16px;padding:16px 18px}
.rp h2{font-size:18px;margin:0 0 10px}.rp p{line-height:1.75;font-size:15.5px;color:var(--ex);margin:0 0 12px}
mark{background:var(--mk);color:var(--ink);border-radius:4px;padding:1px 2px}mark.cur{outline:2px solid var(--acc)}
.qq{padding:10px 0 14px;border-bottom:1px solid var(--line)}.qq:last-of-type{border:0}
.qq p{margin:0 0 8px;font-weight:600;line-height:1.5}
.qq label{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;line-height:1.45}
.qq label:hover{background:var(--soft)}.qq input{margin-top:4px;accent-color:var(--acc)}
.qq label.right{background:#5cb57d33}.qq label.wrong{background:#e0705f33}
.xp{font-size:14px;line-height:1.6;color:var(--ex);background:var(--soft);border-radius:10px;padding:10px;margin-top:6px}
</style></head><body><div class="wrap">

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bar=(a,b)=>`<div class="bar"><i style="width:${b?a/b*100:0}%"></i></div>`;
let cur,KEY=null,GEN=0,TICK=null;
const later=(f,ms)=>{const g=GEN;setTimeout(()=>{if(g==GEN)f()},ms)};
function play(src,text){try{cur&&cur.pause()}catch(e){}
 if(src){try{cur=new Audio(src);const r=cur.play();if(r&&r.catch)r.catch(()=>speak(text))}catch(e){speak(text)}}else speak(text)}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}
const pw=i=>play(W[i].aw,W[i].w),pe=i=>play(W[i].ae,W[i].ex);
let AC;function click(bad){if(!S.opt.key)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
 o.type=bad?'square':'triangle';o.frequency.value=bad?150:1800;g.gain.setValueAtTime(bad?.06:.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+(bad?.12:.035));o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.13)}catch(e){}}
function done(msg,again,extra=''){KEY=null;app.innerHTML=`<div class="done"><div class="big">🎉</div><h2>${msg}</h2>${extra}<p class="sub">休息一下眼睛，再来一组？</p><button class="pri" onclick="${again}">再来一组</button></div>`}
const fmt=s=>`${String(s/60|0).padStart(2,'0')}:${String(s%60|0).padStart(2,'0')}`;

/* ⌨️ 打字（主模式）：逐键校验，错一个字母整词重来 */
function type(list,label){
 list=list||W.map((_,i)=>i);label=label||'本章';
 let k=0,pos=0,ok=0,bad=0,doneW=0,t0=0,el=0,paused=false,wrong={},lock=false;
 const ti=$('#ti');
 const sec=()=>el+(t0&&!paused?(Date.now()-t0)/1000:0);
 const upd=()=>{const s=sec(),acc=ok+bad?Math.round(ok/(ok+bad)*100):100,wpm=s>3?Math.round(doneW/(s/60)):0;
  const st=$('#tstat');if(!st)return;st.innerHTML=`<div><b>${fmt(s)}</b><span>时间</span></div><div><b>${ok}</b><span>输入数</span></div><div><b>${wpm}</b><span>WPM</span></div><div><b>${acc}%</b><span>正确率</span></div><div><b>${k}/${list.length}</b><span>进度</span></div>`};
 clearInterval(TICK);TICK=setInterval(upd,500);
 const tools=()=>`<div class="tools"><button class="sm${S.opt.snd?' on':''}" data-o="snd">🔊 自动发音</button><button class="sm${S.opt.key?' on':''}" data-o="key">🎹 按键音</button><button class="sm${S.opt.dict?' on':''}" data-o="dict">🙈 默写</button><button class="sm" id="rp">▶ 例句</button></div>`;
 const draw=()=>{const i=list[k],w=W[i];
  app.innerHTML=`<div id="tstat" class="tstat"></div>${tools()}${bar(k,list.length)}
  <div class="stage" id="stage"><div class="tw${S.opt.dict?' dict':''}" id="tw">${[...w.w].map(c=>`<span>${esc(c)}</span>`).join('')}</div>
  <div class="tph">${esc(w.ph)} <button class="snd sm" id="pw">🔊</button></div><div class="tmean">${esc(w.m)}</div>
  <div class="tex">${S.opt.dict?esc(w.ex).replace(new RegExp(w.w.slice(0,-1).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','gi'),'_____'):esc(w.ex)}</div>
  ${paused?'<div class="paused">⏸ 已暂停，按任意字母继续</div>':''}
  <div class="tnext">${k+1<list.length?'下一个：'+esc(S.opt.dict?W[list[k+1]].m:W[list[k+1]].w):'最后一个'}</div></div>
  <div class="keys">直接用键盘输入 · <kbd>Enter</kbd> 重播发音 · <kbd>Tab</kbd> 跳过 · <kbd>Esc</kbd> 暂停 · <kbd>Ctrl</kbd>+<kbd>D</kbd> 默写 · <kbd>Ctrl</kbd>+<kbd>E</kbd> 例句</div>`;
  upd();
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.opt[b.dataset.o]=!S.opt[b.dataset.o];save();draw();ti.focus()});
  $('#pw').onclick=e=>{e.stopPropagation();pw(i);ti.focus()};$('#rp').onclick=()=>{pe(i);ti.focus()};
  $('#stage').onclick=()=>ti.focus();
  if(S.opt.snd)pw(i);try{ti.focus({preventScroll:true})}catch(e){}
 };
 const paint=()=>{const sp=$('#tw').children;for(let j=0;j<sp.length;j++)sp[j].className=j<pos?'ok':''};
 const finishWord=skip=>{if(skip){wrong[list[k]]=(wrong[list[k]]||0)+1}else doneW++;
  k++;pos=0;if(k>=list.length)return end();draw()};
 const end=()=>{clearInterval(TICK);const s=sec(),acc=ok+bad?Math.round(ok/(ok+bad)*100):100,wpm=s>0?Math.round(doneW/(s/60)):0,ws=Object.keys(wrong).map(Number);
  S.typing.push({at:Date.now(),n:list.length,time:Math.round(s),wpm,acc,wrong:ws.map(i=>W[i].w),dict:S.opt.dict});S.typing=S.typing.slice(-50);
  ws.forEach(i=>delete S.known[i]);save();KEY=null;
  app.innerHTML=`<div class="done"><div class="big">${ws.length?'💪':'🎉'}</div><h2>${label}完成</h2>
  <div class="tstat"><div><b>${fmt(s)}</b><span>时间</span></div><div><b>${ok}</b><span>输入数</span></div><div><b>${wpm}</b><span>WPM</span></div><div><b>${acc}%</b><span>正确率</span></div><div><b>${ws.length}</b><span>错词</span></div></div>
  ${ws.length?`<div class="wl">${ws.map(i=>`<div><b>${esc(W[i].w)}</b><span class="sub">${esc(W[i].m)} · 错 ${wrong[i]} 次</span></div>`).join('')}</div>`:'<p class="sub">全部一次拼对，太棒了！</p>'}
  <div class="row" style="max-width:460px;margin:16px auto 0">${ws.length?'<button class="pri" id="rw">重练错词 <kbd>Enter</kbd></button>':''}<button id="dc">默写本章</button><button id="ag">再来一遍</button></div></div>`;
  const rw=()=>type(ws,'错词重练'),dc=()=>{S.opt.dict=true;save();type(list,'默写')},ag=()=>type(list,label);
  if(ws.length)$('#rw').onclick=rw;$('#dc').onclick=dc;$('#ag').onclick=ag;
  KEY=e=>{if(e.key=='Enter'){e.preventDefault();ws.length?rw():ag()}};
 };
 const key=ch=>{if(lock)return;const w=W[list[k]].w;if(paused){paused=false;t0=Date.now();draw()}if(!t0)t0=Date.now();
  if(ch.toLowerCase()===w[pos].toLowerCase()){ok++;pos++;click(false);paint();if(pos>=w.length){lock=true;later(()=>{lock=false;finishWord(false)},S.opt.dict?450:250)}}
  else{bad++;wrong[list[k]]=(wrong[list[k]]||0)+1;click(true);const sp=$('#tw').children;sp[pos].className="err";
   const tw=$('#tw');tw.classList.remove('shake');void tw.offsetWidth;tw.classList.add('shake');lock=true;
   later(()=>{lock=false;pos=0;paint();const sp2=$('#tw').children;for(const s of sp2)s.className=''},300)}
  upd()};
 KEY=e=>{if(e.ctrlKey&&(e.key=='d'||e.key=='D')){e.preventDefault();S.opt.dict=!S.opt.dict;save();draw();return}
  if(e.ctrlKey&&(e.key=='e'||e.key=='E')){e.preventDefault();pe(list[k]);return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key=='Enter'){e.preventDefault();pw(list[k])}else if(e.key=='Tab'){e.preventDefault();if(!lock)finishWord(true)}
  else if(e.key=='Escape'){if(!t0)return;if(paused){paused=false;t0=Date.now()}else{el=sec();paused=true}draw()}
  else if(e.key.length==1&&/[a-zA-Z'\- ]/.test(e.key)){e.preventDefault();key(e.key)}};
 ti.oninput=()=>{const v=ti.value;ti.value='';for(const c of v)if(KEY)key(c)};
 draw()}

function card(){let pool=W.map((_,i)=>i).filter(i=>!S.known[i]);if(!pool.length)pool=W.map((_,i)=>i);
 let q=shuf(pool).slice(0,5),n=q.length,ok=0;
 const show=()=>{if(!q.length)return done(`本组完成！已认识 ${Object.keys(S.known).length}/${W.length}`,'card()');
  const i=q[0],w=W[i];let mark=null;
  app.innerHTML=`<div class="stats"><span>本组 ${ok}/${n}</span><span>剩余 ${q.length}</span></div>${bar(ok,n)}
  <div class="flip" id="fc"><div class="inner"><div class="face"><div class="word">${esc(w.w)}</div><div class="ph">${esc(w.ph)}</div>
  <div><button class="snd" id="b1">🔊 单词</button></div><div class="hint">按空格翻面</div></div>
  <div class="face back"><div class="word" style="font-size:26px">${esc(w.w)}</div><div class="mean">${esc(w.m)}</div><div class="ex">${esc(w.ex)}</div>
  <div><button class="snd" id="b2">🔊 单词</button><button class="snd" id="b3">🔊 例句</button></div></div></div></div>
  <div class="row" style="margin-bottom:6px"><button class="bad" id="no">不认识</button><button class="good" id="yes">认识 ✓</button></div><div class="hint" style="text-align:center;margin:0 0 10px">按空格翻面</div>
  <button class="pri" id="next" style="width:100%">下一个 →</button>
  <div class="keys"><kbd>空格</kbd> 翻面 · <kbd>→</kbd> 下一个 · <kbd>1</kbd> 不认识 · <kbd>2</kbd> 认识 · <kbd>P</kbd> 发音</div>`;
  const fc=$('#fc'),flip=()=>fc.classList.toggle('f'),stop=f=>e=>{e.stopPropagation();f()};
  $('#b1').onclick=$('#b2').onclick=stop(()=>pw(i));$('#b3').onclick=stop(()=>pe(i));
  const setM=v=>{mark=v;if(v)S.known[i]=1;else delete S.known[i];save();$('#yes').classList.toggle('mark',v===true);$('#no').classList.toggle('mark',v===false)};
  $('#yes').onclick=()=>setM(true);$('#no').onclick=()=>setM(false);
  const next=()=>{if(mark===false)q.push(q.shift());else{q.shift();ok++}show()};$('#next').onclick=next;
  KEY=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==' '){e.preventDefault();flip()}else if(e.key=='ArrowRight')next();else if(e.key=='1')setM(false);else if(e.key=='2')setM(true);else if(e.key.toLowerCase()=='p')pw(i)};
  pw(i)};show()}

function quiz(){const q=shuf(W.map((_,i)=>i)).slice(0,10);let k=0,score=0,streak=0;
 const show=()=>{if(k>=q.length){S.best=Math.max(S.best,score);save();return done(`得分 ${score}/${q.length} · 最高 ${S.best}`,'quiz()')}
  const i=q[k],listen=Math.random()<.5,opts=shuf([i,...shuf(W.map((_,j)=>j).filter(j=>j!=i)).slice(0,3)]);let answered=false;
  app.innerHTML=`<div class="stats"><span>第 ${k+1}/${q.length} 题</span><span>得分 ${score} · 🔥连对 ${streak}</span></div>${bar(k,q.length)}
  <div class="q">${listen?`<div class="sub">听发音，选出中文意思</div><button class="pri" id="pl" style="font-size:22px;width:120px">🔊</button>`:`<div class="word">${esc(W[i].w)}</div><button class="snd" id="pl">🔊</button>`}</div>
  <div class="opts">${opts.map((j,n)=>`<button data-j="${j}">${n+1}. ${esc(W[j].m)}</button>`).join('')}</div><div class="fb" id="fb"></div>
  <div class="keys"><kbd>1</kbd>-<kbd>4</kbd> 选择 · <kbd>P</kbd> 发音</div>`;
  $('#pl').onclick=()=>pw(i);if(listen)pw(i);
  const pick=b=>{if(answered)return;answered=true;const j=+b.dataset.j;app.querySelectorAll('.opts button').forEach(x=>{x.disabled=1;if(+x.dataset.j==i)x.classList.add('ok')});
   if(j==i){score++;streak++;$('#fb').textContent=streak>=3?`连对 ${streak} 题 🔥`:'正确 ✓'}else{streak=0;b.classList.add('no');$('#fb').textContent=`是 ${W[i].w}：${W[i].m}`;delete S.known[i];save()}
   k++;later(show,j==i?900:1800)};
  const bs=app.querySelectorAll('.opts button');bs.forEach(b=>b.onclick=()=>pick(b));
  KEY=e=>{if(/^[1-4]$/.test(e.key))pick(bs[+e.key-1]);else if(e.key.toLowerCase()=='p')pw(i)}};show()}

/* 音节：自由拆分工具（无标准答案），保存在本地 */
function syl(){let k=S.sylAt||0;
 const show=()=>{k=(k+W.length)%W.length;S.sylAt=k;save();const i=k,w=W[i],L=[...w.w],on=new Set(S.syl[w.w]||[]);let cur=1;
  const txt=()=>L.map((c,j)=>(on.has(j)?'·':'')+c).join('');
  const store=()=>{if(on.size)S.syl[w.w]=[...on].sort((a,b)=>a-b);else delete S.syl[w.w];save()};
  const draw=()=>{$('#sy').innerHTML=L.map((c,j)=>(j?`<button class="gap${on.has(j)?' on':''}${cur==j?' cur':''}" data-g="${j}" aria-label="分隔"></button>`:'')+`<span>${esc(c)}</span>`).join('');
   $('#sy').querySelectorAll('.gap').forEach(g=>g.onclick=()=>{cur=+g.dataset.g;tog()});$('#myw').textContent=on.size?txt():'（还没有拆分）'};
  const tog=()=>{if(L.length<2)return;on.has(cur)?on.delete(cur):on.add(cur);store();draw()};
  app.innerHTML=`<div class="stats"><span>${k+1}/${W.length}</span><span>已拆 ${Object.keys(S.syl).length} 个</span></div>${bar(k+1,W.length)}
  <div class="q"><div class="sub">点击字母之间的空隙，插入/删除你自己的分隔点 ·</div><div class="sy" id="sy"></div>
  <div class="myw" id="myw"></div><div class="ph">${esc(w.ph)} · ${esc(w.m)}</div>
  <button class="snd" id="pl">🔊 单词</button><button class="snd" id="pe">🔊 例句</button></div>
  <div class="row"><button id="pv">← 上一个</button><button id="clr">清空</button><button class="pri" id="nx">下一个 →</button></div>
  <div class="keys"><kbd>←</kbd>/<kbd>→</kbd> 移动光标 · <kbd>空格</kbd> 插入/删除 · <kbd>N</kbd>/<kbd>B</kbd> 下一个/上一个 · <kbd>P</kbd> 发音 · <kbd>Backspace</kbd> 清空</div>`;
  draw();$('#pl').onclick=()=>pw(i);$('#pe').onclick=()=>pe(i);pw(i);
  $('#clr').onclick=()=>{on.clear();store();draw()};$('#nx').onclick=()=>{k++;show()};$('#pv').onclick=()=>{k--;show()};
  KEY=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const x=e.key;if(x=='ArrowLeft'){cur=Math.max(1,cur-1);draw()}else if(x=='ArrowRight'){cur=Math.min(L.length-1,cur+1);draw()}
   else if(x==' '){e.preventDefault();tog()}else if(x.toLowerCase()=='n'){k++;show()}else if(x.toLowerCase()=='b'){k--;show()}else if(x.toLowerCase()=='p')pw(i);else if(x=='Backspace'){e.preventDefault();$('#clr').click()}}};
 show()}

/* 阅读 */
function read(){if(!R)return;KEY=null;const L='ABCD',prev=S.reading;let t0=Date.now(),sub=!!prev;
 const paras=Array.isArray(R.passage)?R.passage:String(R.passage).split(/\n\s*\n/);
 const hl=(p,qi)=>{let h=esc(p);(R.questions||[]).forEach((q,n)=>{if(!q.locate)return;const s=esc(q.locate);if(sub&&h.includes(s))h=h.replace(s,`<mark id="loc${n}" data-n="${n+1}">${s}</mark>`)});return h};
 const draw=()=>{const a=sub&&S.reading?S.reading.answers:{};let score=0;
  app.innerHTML=`<div class="stats"><span>${esc(R.title||'阅读理解')}</span><span id="rt">${sub?`得分 ${S.reading.score}/${R.questions.length} · 用时 ${fmt(S.reading.time)}`:'⏱ 00:00'}</span></div>
  <div class="rd" style="margin-top:10px"><div class="rp"><h2>${esc(R.title||'')}</h2>${paras.map(p=>`<p>${hl(p)}</p>`).join('')}</div>
  <div class="rq"><form id="rf">${R.questions.map((q,n)=>{const ok=a[n]===q.answer;if(ok)score++;
   return `<div class="qq"><p>${n+1}. ${esc(q.q)} ${sub?(ok?'<span style="color:var(--good)">✓</span>':'<span style="color:var(--bad)">✗</span>'):''}</p>
   ${q.options.map((o,j)=>{const v=L[j],cls=sub?(v==q.answer?'right':(a[n]==v?'wrong':'')):'';return `<label class="${cls}"><input type="radio" name="q${n}" value="${v}" ${a[n]==v?'checked':''} ${sub?'disabled':''}><span><b>${v}.</b> ${esc(String(o).replace(/^[A-D][.)．、]\s*/,''))}</span></label>`}).join('')}
   ${sub?`<div class="xp">正确答案 <b>${q.answer}</b>${a[n]&&!ok?`（你选了 ${a[n]}）`:a[n]?'':'（未作答）'}。${esc(q.explain||'')}${q.locate?` <button type="button" class="sm snd" data-loc="${n}">📍 定位原文</button>`:''}</div>`:''}</div>`}).join('')}</form>
  ${sub?'<button class="pri" id="redo" style="width:100%;margin-top:10px">重做</button>':'<button class="pri" id="sb" style="width:100%;margin-top:10px">提交</button>'}</div></div>`;
  if(sub){app.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{const m=$('#loc'+b.dataset.loc);if(!m)return;app.querySelectorAll('mark').forEach(x=>x.classList.remove('cur'));m.classList.add('cur');m.scrollIntoView({behavior:'smooth',block:'center'})});
   $('#redo').onclick=()=>{sub=false;S.reading=null;save();t0=Date.now();draw()};clearInterval(TICK)}
  else{$('#sb').onclick=()=>{const f=new FormData($('#rf')),ans={};R.questions.forEach((q,n)=>{const v=f.get('q'+n);if(v)ans[n]=v});
    const miss=R.questions.length-Object.keys(ans).length;if(miss&&!confirm(`还有 ${miss} 题没做，确定提交？`))return;
    const sc=R.questions.filter((q,n)=>ans[n]===q.answer).length;S.reading={answers:ans,score:sc,time:Math.round((Date.now()-t0)/1000),at:Date.now()};
    S.readBest=Math.max(S.readBest||0,sc);save();sub=true;draw();window.scrollTo({top:0,behavior:'smooth'})};
   clearInterval(TICK);TICK=setInterval(()=>{const e=$('#rt');if(e&&!sub)e.textContent='⏱ '+fmt((Date.now()-t0)/1000)},1000)}};
 draw()}

const M={type,card,quiz,syl,read};
if(R){const b=document.createElement('button');b.dataset.m='read';b.textContent='📖 阅读';$('#tabs').appendChild(b)}
document.addEventListener('keydown',e=>{const t=e.target;if(t.tagName=='INPUT'&&t.id!='ti'||t.tagName=='TEXTAREA')return;if(KEY){if(e.key==' ')e.preventDefault();KEY(e)}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.blur()});
const thB=$('#th'),setTh=v=>{document.documentElement.dataset.theme=v;thB.textContent=v=='light'?'🌙 深色':'☀️ 浅色';localStorage.setItem('cet6_theme',v)};
setTh(localStorage.getItem('cet6_theme')||'dark');thB.onclick=()=>setTh(document.documentElement.dataset.theme=='light'?'dark':'light');
$('#reset').onclick=()=>{if(confirm('确定清空本天进度？')){localStorage.removeItem(K);location.reload()}};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x==b));S.mode=b.dataset.m;save();KEY=null;GEN++;clearInterval(TICK);b.blur();M[b.dataset.m]()});
tot();($(`#tabs [data-m="${S.mode}"]`)||$('#tabs [data-m="type"]')).click();
</script></body></html>
